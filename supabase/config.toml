# Local-only Forma development. Separate from other Supabase projects on this Mac.
project_id = "forma"
[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 55322
shadow_port = 55320
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 55324
[realtime]
enabled = false
[storage]
enabled = false
[analytics]
enabled = false
[edge_runtime]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://127.0.0.1:4173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 10
[auth.email]
enable_signup = true
# Local testing only. Hosted accounts must confirm their email.
enable_confirmations = false
max_frequency = "1s"
